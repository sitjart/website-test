# ELIXIR-UK website – Jekyll settings
title: ELIXIR-UK
url: "https://sitjart.github.io"
baseurl: "/website-test"      # "" on the real domain

# Search engines: only the real site is indexed. The test site tells them to stay away,
# so it can never compete with elixiruknode.org. Set to true on the real domain.
indexable: false
canonical_root: "https://elixiruknode.org"

# Strict mode: a template that uses a value that doesn't exist stops the build
# (and says where), instead of quietly printing nothing.
liquid:
  error_mode: strict
  strict_filters: true
  strict_variables: true

timezone: Europe/London

# Markdown: headings get their ids from tools/finish.py (the same ids "On this page" uses)
kramdown:
  auto_ids: false
collections_dir: collections
collections:
  # Addresses are the same as on the WordPress site, so old links and search rankings carry over.
  # Stories: /news/2025/<name>/, /blog/2025/<name>/ or /articles/2025/<name>/ (from "categories" and "date")
  news:        { output: true, permalink: /:slugified_categories/:year/:name/ }   # written in the CMS
  events:      { output: true, permalink: /event/:name/ }       # written in the CMS
  webpages:    { output: true, permalink: /:name/ }             # written in the CMS
  # Generated by tools/prepare.py from Baserow / WordPress data – not committed
  members:        { output: true, permalink: /members/:name/ }
  services:       { output: true, permalink: /service/:name/ }
  projects:       { output: true, permalink: /project/:name/ }
  collaborations: { output: true, permalink: /collaborator/:name/ }
  area:           { output: true, permalink: /area/:name/ }
  activities:     { output: true, permalink: /activities/:name/ }
  people:         { output: true, permalink: /people/:name/ }
  newscats:       { output: true, permalink: /news/category/:name/ }
  eventtypes:     { output: true, permalink: /events/type/:name/ }

# Every page has these keys, so templates can test them safely in strict mode.
defaults:
  - scope: { path: "" }
    values: { title: null, description: null, jsonld: null, gen: null, overlay_header: false, page_class: "" }
  # Content written in the CMS is never run through Liquid, so text like {{ or {% can't break the build
  - scope: { path: "", type: news }
    values: { layout: story, gen: news, render_with_liquid: false }
  - scope: { path: "", type: events }
    values: { layout: event, gen: events, render_with_liquid: false }
  - scope: { path: "", type: webpages }
    values: { layout: webpage, gen: webpages, render_with_liquid: false }

sass:
  style: compressed

# _redirects: old addresses that moved, one per line ("/old/ /new/ 301"); read by Cloudflare Pages
include:
  - _redirects

exclude:
  - tools
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .cache
  - node_modules
  - src
  - public
  - dist
  - package.json
  - package-lock.json
  - astro.config.mjs
  - admin/README.md
