# ELIXIR-UK website – Jekyll settings
title: ELIXIR-UK
url: "https://sitjart.github.io"
baseurl: "/website-test"      # "" on the real domain

# Strict mode: a template that uses a value that doesn't exist stops the build
# (and says where), instead of quietly printing nothing.
liquid:
  error_mode: strict
  strict_filters: true
  strict_variables: true

timezone: Europe/London
collections_dir: collections
collections:
  news:        { output: true, permalink: /news/:name/ }        # written in the CMS
  events:      { output: true, permalink: /events/:name/ }      # written in the CMS
  webpages:    { output: true, permalink: /:name/ }             # written in the CMS
  # Generated by tools/prepare.py from Baserow / WordPress data – not committed
  members:        { output: true, permalink: /members/:name/ }
  services:       { output: true, permalink: /services/:name/ }
  projects:       { output: true, permalink: /projects/:name/ }
  collaborations: { output: true, permalink: /collaborations/:name/ }
  area:           { output: true, permalink: /area/:name/ }
  activities:     { output: true, permalink: /activities/:name/ }
  people:         { output: true, permalink: /people/:name/ }
  newscats:       { output: true, permalink: /news/category/:name/ }
  eventtypes:     { output: true, permalink: /events/type/:name/ }

# Every page has these keys, so templates can test them safely in strict mode.
defaults:
  - scope: { path: "" }
    values: { title: null, description: null, jsonld: null, gen: null, overlay_header: false, page_class: "" }
  - scope: { path: "", type: news }
    values: { layout: story, gen: news }
  - scope: { path: "", type: events }
    values: { layout: event, gen: events }
  - scope: { path: "", type: webpages }
    values: { layout: webpage, gen: webpages }

sass:
  style: compressed

exclude:
  - tools
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .cache
  - node_modules
  - src
  - public
  - dist
  - package.json
  - package-lock.json
  - astro.config.mjs
  - .pages.yml
