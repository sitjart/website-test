<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" aria-labelledby="figTitle figDesc"><desc id="figDesc">Two areas are mainly technical: FHIR, openEHR and OMOP alignment, and federated execution using WES and TES. Four are mainly non-technical: TRE governance and tooling, legal and contractual templates, EHDS preparation and monitoring, and overlapping research infrastructures.</desc><style>@import url(https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;display=swap);text{font-family:&quot;Lato&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif}.st,.tt{fill:#023542}.tt{font-size:14px;font-weight:700}.st{font-size:12px;font-weight:400;fill-opacity:.7}</style><rect width="680" height="340" fill="#FFF" rx="12"/><rect width="12" height="12" x="40" y="38" fill="#023542" fill-opacity=".14" stroke="#023542" stroke-width=".5" rx="3"/><text x="58" y="48" class="st">Mainly technical</text><rect width="12" height="12" x="200" y="38" fill="#F47D20" fill-opacity=".18" stroke="#F47D20" stroke-width=".5" rx="3"/><text x="218" y="48" class="st">Mainly non-technical</text><rect width="280" height="68" x="40" y="76" fill="#023542" fill-opacity=".07" stroke="#023542" stroke-width=".5" rx="8"/><text x="64" y="106" class="tt">FHIR / openEHR / OMOP alignment</text><text x="64" y="126" class="st">Most debated standards question</text><rect width="280" height="68" x="360" y="76" fill="#023542" fill-opacity=".07" stroke="#023542" stroke-width=".5" rx="8"/><text x="384" y="106" class="tt">Federated execution: WES, TES</text><text x="384" y="126" class="st">Rated highest, adopted least</text><rect width="280" height="68" x="40" y="164" fill="#F47D20" fill-opacity=".12" stroke="#F47D20" stroke-width=".5" rx="8"/><text x="64" y="194" class="tt">TRE governance and tooling</text><text x="64" y="214" class="st">Mature models, low awareness</text><rect width="280" height="68" x="360" y="164" fill="#F47D20" fill-opacity=".12" stroke="#F47D20" stroke-width=".5" rx="8"/><text x="384" y="194" class="tt">Legal and contractual templates</text><text x="384" y="214" class="st">Most cited barrier overall</text><rect width="280" height="68" x="40" y="252" fill="#F47D20" fill-opacity=".12" stroke="#F47D20" stroke-width=".5" rx="8"/><text x="64" y="282" class="tt">EHDS preparation and monitoring</text><text x="64" y="302" class="st">Most cited external driver</text><rect width="280" height="68" x="360" y="252" fill="#F47D20" fill-opacity=".12" stroke="#F47D20" stroke-width=".5" rx="8"/><text x="384" y="282" class="tt">Overlapping infrastructures</text><text x="384" y="302" class="st">ELIXIR, BBMRI, EATRIS overlap</text></svg>