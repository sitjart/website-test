<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" width="680" height="340" viewBox="0 0 680 340" role="img" aria-labelledby="figTitle figDesc">
  <metadata></metadata>
  <title id="figTitle">Six areas for cross-Node collaboration on health data</title>
  <desc id="figDesc">Two areas are mainly technical: FHIR, openEHR and OMOP alignment, and federated execution using WES and TES. Four are mainly non-technical: TRE governance and tooling, legal and contractual templates, EHDS preparation and monitoring, and overlapping research infrastructures.</desc>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;display=swap');
text { font-family: 'Lato', 'Helvetica Neue', Arial, sans-serif; }
.tt { font-size: 14px; font-weight: 700; fill: #023542; }
.st { font-size: 12px; font-weight: 400; fill: #023542; fill-opacity: .7; }
</style>
  <rect x="0" y="0" width="680" height="340" rx="12" fill="#FFFFFF"></rect>
  <rect x="40" y="38" width="12" height="12" rx="3" fill="#023542" fill-opacity="0.14" stroke="#023542" stroke-width="0.5"></rect>
  <text class="st" x="58" y="48">Mainly technical</text>
  <rect x="200" y="38" width="12" height="12" rx="3" fill="#F47D20" fill-opacity="0.18" stroke="#F47D20" stroke-width="0.5"></rect>
  <text class="st" x="218" y="48">Mainly non-technical</text>
  <rect x="40" y="76" width="280" height="68" rx="8" fill="#023542" fill-opacity="0.07" stroke="#023542" stroke-width="0.5"></rect>
  <text class="tt" x="64" y="106">FHIR / openEHR / OMOP alignment</text>
  <text class="st" x="64" y="126">Most debated standards question</text>
  <rect x="360" y="76" width="280" height="68" rx="8" fill="#023542" fill-opacity="0.07" stroke="#023542" stroke-width="0.5"></rect>
  <text class="tt" x="384" y="106">Federated execution: WES, TES</text>
  <text class="st" x="384" y="126">Rated highest, adopted least</text>
  <rect x="40" y="164" width="280" height="68" rx="8" fill="#F47D20" fill-opacity="0.12" stroke="#F47D20" stroke-width="0.5"></rect>
  <text class="tt" x="64" y="194">TRE governance and tooling</text>
  <text class="st" x="64" y="214">Mature models, low awareness</text>
  <rect x="360" y="164" width="280" height="68" rx="8" fill="#F47D20" fill-opacity="0.12" stroke="#F47D20" stroke-width="0.5"></rect>
  <text class="tt" x="384" y="194">Legal and contractual templates</text>
  <text class="st" x="384" y="214">Most cited barrier overall</text>
  <rect x="40" y="252" width="280" height="68" rx="8" fill="#F47D20" fill-opacity="0.12" stroke="#F47D20" stroke-width="0.5"></rect>
  <text class="tt" x="64" y="282">EHDS preparation and monitoring</text>
  <text class="st" x="64" y="302">Most cited external driver</text>
  <rect x="360" y="252" width="280" height="68" rx="8" fill="#F47D20" fill-opacity="0.12" stroke="#F47D20" stroke-width="0.5"></rect>
  <text class="tt" x="384" y="282">Overlapping infrastructures</text>
  <text class="st" x="384" y="302">ELIXIR, BBMRI, EATRIS overlap</text>
</svg>