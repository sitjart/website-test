{%- comment -%}
  A resized image from tools/sitebuild/images.py.
  img: the image ({small, large}); size: "small" or "large"; alt; cls: class or nil; loading: "lazy" or "eager"
{%- endcomment -%}
{%- assign _img = include.img[include.size] -%}
<img src="{{ _img.src }}" alt="{{ include.alt }}"{% if include.cls %} class="{{ include.cls }}"{% endif %} loading="{{ include.loading }}" decoding="async"{% if _img.w %} width="{{ _img.w }}" height="{{ _img.h }}"{% endif %}>
