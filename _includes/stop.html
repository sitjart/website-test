{%- comment -%} The orange full stop after a display title, unless it already ends in punctuation. {%- endcomment -%}
{%- assign _stop_last = include.title | strip | slice: -1 -%}
{%- unless _stop_last == "." or _stop_last == "!" or _stop_last == "?" or _stop_last == "…" %}<span class="stop">.</span>{% endunless -%}
