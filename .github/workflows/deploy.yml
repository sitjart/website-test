name: Build and deploy

# Three steps, each of which stops the build if something is wrong – then nothing is published:
#   1. tools/prepare.py  – reads and checks the content, Baserow/WordPress data and people; resizes images
#   2. jekyll build      – strict templates: a missing value stops the build and names the file
#   3. tools/finish.py   – checks every internal link and image; builds the search index
# Every branch is built and checked. Only main is published.

on:
  push:
  schedule:
    - cron: '17 3 * * *'      # nightly: picks up data changes and moves past events
  repository_dispatch:
    types: [baserow-update]   # a Baserow webhook can trigger a rebuild
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Restore resized images
        uses: actions/cache@v4
        with:
          path: |
            .cache/images
            assets/img
          key: images-${{ github.run_id }}
          restore-keys: images-

      - name: 1. Prepare and check the data
        run: python3 tools/prepare.py
        env:
          # People come from WordPress (published profiles only) until Baserow takes over.
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
      - name: 2. Build the pages
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: 3. Check the built site and build the search index
        run: python3 tools/finish.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
