title: How we are funded
lede: >-
  ELIXIR-UK is funded to connect UK research organisations with ELIXIR and to channel its
  resources, projects and opportunities to them. The Node does not fund members' services or
  research: those are funded through projects.

ways:
  - title: The UK's subscription to ELIXIR
    body: >-
      The UK is a member of ELIXIR. UKRI pays the country's subscription through BBSRC, MRC and NERC,
      and BBSRC signed the ELIXIR Consortium Agreement on the UK's behalf.


      The subscription is an investment the UK has already made on behalf of its universities and
      research institutes. Joining ELIXIR-UK is free. An eligible organisation that does not join
      leaves part of that investment unused.
    link: { label: Become a member, href: /about/new-members/ }
  - title: The Coordination office
    body: >-
      BBSRC funds the ELIXIR-UK Coordination office at the Earlham Institute. The grant pays for
      coordination and engagement: bringing UK people, services and training into ELIXIR, and bringing
      ELIXIR's resources, funding calls and collaborations back to member organisations through visits,
      bursaries, Clubs and the Ambassadors Programme.
    link: null
  - title: Projects
    body: >-
      Members are funded for their work in ELIXIR through projects: ELIXIR projects paid for from
      ELIXIR's own budget, such as Commissioned Services; European projects that ELIXIR coordinates or
      takes part in; and national projects from UK funders or the members themselves. They are listed
      above.
    link: null

grants_title: Coordination office grants
grants_intro: >-
  Grants to the Earlham Institute as Lead Institute for ELIXIR-UK, newest first. The first award
  was a joint award to several institutions.

