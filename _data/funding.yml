title: How we are funded
lede: >-
  ELIXIR-UK is funded to connect UK research organisations with ELIXIR and to channel funding,
  projects and opportunities from the UK and Europe to them. The Node does not fund members' services or
  research: we help members win the funding that does.

ways:
  - title: The UK's subscription to ELIXIR
    body: >-
      The UK is a member of ELIXIR. UKRI pays the country's subscription through BBSRC, MRC and NERC,
      and BBSRC signed the ELIXIR Consortium Agreement on the UK's behalf.


      The subscription is an investment the UK has already made on behalf of its universities and
      research institutes. Joining ELIXIR-UK is free. An eligible organisation that does not join
      leaves part of that investment unused.
    link: { label: Become a member, href: /about/new-members/ }
  - title: The Coordination office
    body: >-
      BBSRC funds the ELIXIR-UK Coordination office at the Earlham Institute. The grant pays for
      coordination and engagement: bringing UK people, services and training into ELIXIR, and channelling
      funding calls, projects and collaborations from the UK and Europe to member organisations through
      opportunities, visits, bursaries, Clubs and the Ambassadors Programme.
    link: { label: Find opportunities, href: "https://elixiruknode.org/opportunities/" }
  - title: Our members' projects
    body: >-
      Members are funded for their work in ELIXIR through projects: ELIXIR projects paid for from
      ELIXIR's own budget, such as Commissioned Services; European projects that ELIXIR coordinates or
      takes part in; and national projects from UK funders or the members themselves. We help members
      find and join them. These projects fund members' work, not the Coordination office.
    link: { label: See the projects, href: /projects/ }

projects_note: >-
  These projects fund our members' work in ELIXIR, Europe and the UK. None of them funds the ELIXIR-UK
  Coordination office, which BBSRC funds directly. The Node helps members win this funding by channelling
  calls and opportunities from the UK and Europe.

